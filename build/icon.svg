<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!--
    O ÍCONE DO MPTRIX.

    O que estava aqui era rascunho: quadrado com degradê azul-roxo e um "M"
    branco, de uma fonte do sistema. Não era da casa — a casa é preto quase
    total com UM destaque lima, e a marca é a ampulheta dentro do hexágono, que
    já vive no cabeçalho do app, na tela do celular e no relógio da tela
    inicial.

    Ícone é a primeira coisa que alguém vê do programa, e era a única peça que
    ainda falava outra língua.

    A ampulheta é um FURO na chapa lima, não um desenho por cima: é assim no
    relógio, e é o que faz a marca ser reconhecida de longe. Em 16px o hexágono
    lima sobre preto continua se lendo — forma cheia lê pequena.
  -->
  <defs>
    <radialGradient id="brilho" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0%" stop-color="#b6ff3b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b6ff3b" stop-opacity="0"/>
    </radialGradient>
    <mask id="chapa">
      <!-- branco = fica; preto = vira buraco -->
      <path d="M512 206 L770 356 L770 668 L512 818 L254 668 L254 356 Z" fill="#fff"/>
      <path d="M4.5 2H19.5L13.4 12L19.5 22H4.5L10.6 12Z"
            transform="translate(317.6 317.6) scale(16.2)" fill="#000"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#0b0c0f"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#brilho)"/>

  <g mask="url(#chapa)">
    <rect x="0" y="0" width="1024" height="1024" fill="#b6ff3b"/>
  </g>
</svg>
