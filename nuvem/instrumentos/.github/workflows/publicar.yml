# Constroi e publica o extrator de INSTRUMENTOS no Replicate.
# Roda numa maquina do GitHub porque a maquina do dono tem 6GB de RAM e instalar
# Docker nela pra isso seria pior que o problema. O cog monta imagem de GPU sem
# precisar de GPU na maquina que constroi.
name: publicar extrator de instrumentos

on:
  workflow_dispatch:
    inputs:
      destino:
        description: "usuario/modelo no Replicate (ex: 41r4n/mptrix-instrumentos)"
        required: true
        default: "41r4n/mptrix-instrumentos"

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # a imagem com torch + cuda passa de 10GB; a maquina do GitHub vem quase
      # cheia, entao o espaco tem que ser liberado ANTES de construir
      - name: liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: construir e publicar
        run: cog push r8.im/${{ inputs.destino }}
