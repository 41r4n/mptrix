# Empacotamento do BTC (Bi-directional Transformer for Chord Recognition,
# ISMIR 2019, licenca MIT) pra rodar como modelo no Replicate.
#
# POR QUE ISSO EXISTE: o detector local do MPTrix usa croma + casamento de
# gabarito, que a literatura mede como o pior dos metodos disponiveis. O BTC e
# rede neural treinada, e o vocabulario grande dele tem 170 acordes -- inclui
# setima, diminuto e meio-diminuto, que e exatamente o que a cifra da Azul pede
# e o que o madmom (so maior/menor) NAO daria.
build:
  gpu: true
  cuda: "11.8"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "git"
  python_packages:
    - "torch==2.0.1"
    - "numpy==1.23.5"
    - "librosa==0.9.2"
    - "numba==0.56.4"
    - "soundfile==0.12.1"
    - "pyyaml==6.0"
    - "pandas==1.5.3"
    - "mir_eval==0.7"
    - "pretty_midi==0.2.10"
  run:
    # o codigo E os pesos vivem no mesmo repositorio (test/*.pt)
    - git clone --depth 1 https://github.com/jayg996/BTC-ISMIR19.git /btc
    # se os pesos vierem como ponteiro do git-lfs, o build tem que falhar AQUI
    # e nao na primeira predicao -- erro cedo e barato, erro tarde e caro
    - python -c "import os,sys; p='/btc/test/btc_model_large_voca.pt'; s=os.path.getsize(p); print('pesos:', s//1024//1024, 'MB'); sys.exit(0 if s > 1_000_000 else 'pesos vieram como ponteiro LFS, nao como modelo')"
predict: "predict.py:Predictor"
